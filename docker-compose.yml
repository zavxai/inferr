services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_feed
    ports:
      - '${DB_HOST_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${API_HOST_PORT:-4001}:${API_PORT:-3001}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_feed
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: 'false'
      API_PORT: ${API_PORT:-3001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: ai-feed-api
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  web:
    image: node:22-bookworm
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@10.15.1 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @ai-developer-feed/web dev"
    environment:
      WEB_PORT: ${WEB_PORT:-4000}
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4001}
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-4000}:${WEB_PORT:-4000}'
    volumes:
      - .:/app
      - web_root_modules:/app/node_modules
      - web_app_modules:/app/apps/web/node_modules
      - web_api_modules:/app/apps/api/node_modules
      - web_types_modules:/app/packages/types/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '${JAEGER_UI_PORT:-16687}:16686' # Jaeger UI
      - '${JAEGER_GRPC_PORT:-5317}:4317' # OTLP gRPC receiver
      - '${JAEGER_HTTP_PORT:-5318}:4318' # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
  web_root_modules:
  web_app_modules:
  web_api_modules:
  web_types_modules:
  web_next:
